services:
  api:
    build: .
    image: fit-scorer:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data            # criteria/profile cache + runs.jsonl metrics survive restarts
      - ./config:/app/config:ro     # edit weights without rebuilding; restart the api to apply
    restart: unless-stopped

  ui:
    image: fit-scorer:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
